[package]
name = "agentnotch-proto"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "Apache-2.0"
description = "Agent Notch for Windows: the hook ⇄ app wire protocol (frames, messages, permission output). Pure; used by the hook exe and the engine."

# No C, no Tauri, no windows crates, no argument parser (check-seams.sh
# enforces the names): the hook exe links this and must fail open.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
