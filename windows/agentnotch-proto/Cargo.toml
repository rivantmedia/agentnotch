# Agent Notch's hook ⇄ app wire protocol (DESIGN-WIN §1.4, §3.1): framing, the
# hook's messages, argv parsing and the PermissionRequest answer. Pure Rust, no
# OS calls, no C, so the hook exe, the engine and every test share one copy and
# `cargo test` runs on any OS. check-seams.sh rejects a platform crate here.
[package]
name = "agentnotch-proto"
version = "0.0.0"          # never shown: the app's version is tauri.conf.json's (= VERSION)
edition = "2021"
rust-version = "1.88"
publish = false
license = "Apache-2.0"
description = "Agent Notch: the hook ⇄ app wire protocol"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
# The protocol is data in, data out; nothing here needs unsafe.
unsafe_code = "forbid"
