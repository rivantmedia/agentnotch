# Superpowered Codenotch, a fork of Codenotch (github.com/vinzdg/codenotch, MIT).
# The project, scheme and target keep upstream's name "Codenotch" so the
# Makefile and upstream merges keep working; the product is renamed below
# (PRODUCT_NAME / PRODUCT_BUNDLE_IDENTIFIER) so it installs and runs beside the
# official app. Package.swift mirrors this file for Command Line Tools builds.
name: Codenotch
options:
  bundleIdPrefix: com.paraswtf
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  defaultLocalization: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Sparkle compares CFBundleVersion to decide what is newer, and
    # Sources/Info.plist reads both from here — hardcoding them there instead
    # silently pins every build to one version, so no customer ever sees an
    # update. Bump CURRENT_PROJECT_VERSION on every release.
    MARKETING_VERSION: "1.18.0"
    CURRENT_PROJECT_VERSION: "20"
    # Signed with a stable identity on purpose: the keychain's ACL for the
    # app's own items (Ollama, LM Studio, MiniMax keys, custom endpoints)
    # remembers *which signed binary* was allowed. Ad-hoc or unsigned builds
    # get a new identity on every rebuild, so "Always Allow" would be
    # forgotten each time. Fork: this app reads no Claude token (the Claude
    # rings come from ClaudeControl). DEVELOPMENT_TEAM is still upstream's;
    # a signed or notarised fork build needs the fork's own team (open item,
    # design §14 Q5). Day-to-day builds use Scripts/spm-build-app.sh (ad hoc).
    CODE_SIGN_IDENTITY: "Developer ID Application"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 6WFPL8B9FB
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    # Required by notarization. Worth knowing what it does *not* break here:
    # the keychain read is unaffected (the ACL keys on the signing identity,
    # which is unchanged), and reading Cursor's and Codex's SQLite files is
    # ordinary file access. It is the App Sandbox that would break both, which
    # is why that stays off — Developer ID distribution does not require it.
    ENABLE_HARDENED_RUNTIME: "YES"
    ENABLE_APP_SANDBOX: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

packages:
  SwiftNIO:
    url: https://github.com/apple/swift-nio
    from: "2.102.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  # Fork: the Claude Code control layer, kept out of upstream's Sources/.
  ClaudeControl:
    path: Packages/ClaudeControl

targets:
  Codenotch:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          # Notes for whoever next re-generates the vendored decoder. Left in the
          # navigator beside the code it describes, but Xcode would otherwise
          # copy any unrecognised file into the app bundle's Resources, and a
          # developer README has no business shipping to users.
          - "Vendor/**/README.md"
    # Fork: the notices the licences ask to travel with the binary, the same
    # files Scripts/spm-build-app.sh copies: Codenotch's MIT licence, the
    # vendored zstd's, ClaudeControl's Apache-2.0 LICENSE and NOTICE (derived
    # from Superpowered Vibe Notch and Vibe Notch), and swift-markdown's and
    # swift-cmark's (linked statically into it).
    postBuildScripts:
      - name: Copy licence notices
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          R="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          cp "$SRCROOT/LICENSE" "$R/Codenotch-LICENSE.txt"
          cp "$SRCROOT/Sources/Vendor/zstd/LICENSE" "$R/zstd-LICENSE.txt"
          cp "$SRCROOT/Packages/ClaudeControl/LICENSE" "$R/ClaudeControl-LICENSE.txt"
          cp "$SRCROOT/Packages/ClaudeControl/NOTICE" "$R/ClaudeControl-NOTICE.txt"
          C=""
          # DerivedData's SourcePackages: the part of BUILD_DIR before /Build/ is the
          # DerivedData folder for plain builds and for `xcodebuild archive`
          # (…/ArchiveIntermediates/<scheme>/BuildProductsPath) alike (CS-6).
          for candidate in "${BUILD_DIR%%/Build/*}/SourcePackages/checkouts" "$BUILD_DIR/../../SourcePackages/checkouts" "$SRCROOT/.build/checkouts"; do
            if [ -f "$candidate/swift-markdown/LICENSE.txt" ]; then C="$candidate"; break; fi
          done
          if [ -z "$C" ]; then echo "error: swift-markdown checkout not found for its licence"; exit 1; fi
          cp "$C/swift-markdown/LICENSE.txt" "$R/swift-markdown-LICENSE.txt"
          cp "$C/swift-markdown/NOTICE.txt" "$R/swift-markdown-NOTICE.txt"
          cp "$C/swift-cmark/COPYING" "$R/swift-cmark-COPYING.txt"
    dependencies:
      - package: Sparkle
      - package: SwiftNIO
        product: NIOHTTP1
      - package: SwiftNIO
        product: NIOPosix
      - package: ClaudeControl
        product: ClaudeControl
    info:
      path: Sources/Info.plist
      properties:
        # Deliberately a normal Dock app, not an `LSUIElement` agent. The
        # notch is ambient, but the *app* still has to be findable: without a
        # Dock tile there is nothing to click to open it, nothing in Cmd-Tab,
        # and no obvious way to reach settings or quit.
        CFBundleName: Superpowered Codenotch
        CFBundleDisplayName: Superpowered Codenotch
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - fr
          - de
          - id
          - ja
          - ko
          - pt-BR
          - ru
          - zh-Hans
          - zh-Hant
          - uk
          - uz
          - tr
        LSMinimumSystemVersion: "15.0"
        # Sources/Info.plist is *generated* from this block, so editing that
        # file directly is undone by the next `make gen`. Pointing both at the
        # build settings keeps one place to bump.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: "Superpowered Codenotch answers your phone on this network so it can show your usage."
        # Fork: Claude Code sessions are focused and answered in their terminal
        # tab through Apple Events (Terminal, iTerm2).
        NSAppleEventsUsageDescription: "Superpowered Codenotch selects the terminal tab a Claude session runs in and types your replies into it."
        # --- Sparkle -------------------------------------------------------
        # Fork: no feed, no public key, no automatic checks. Upstream's feed
        # (hivinz.com) and EdDSA key would silently replace this build with the
        # official Codenotch; `Updater` is also inert (`Fork.updatesEnabled`).
        SUEnableAutomaticChecks: false
    settings:
      base:
        # Fork: our own bundle id (and so our own defaults domain, login item
        # and notification settings), and a product name that cannot be
        # mistaken for the official app. The module stays `Codenotch` so the
        # tests' `@testable import Codenotch` and upstream merges keep working.
        PRODUCT_BUNDLE_IDENTIFIER: com.paraswtf.superpowered-codenotch
        PRODUCT_NAME: "Superpowered Codenotch"
        PRODUCT_MODULE_NAME: Codenotch
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: "YES"
        DEVELOPMENT_LANGUAGE: en
        # The only C in the project is the vendored Zstandard decoder, and this
        # is how Swift sees it. It is needed because Claude Desktop's HTTP cache
        # stores bodies with `content-encoding: zstd` and macOS ships no zstd
        # anywhere a signed, notarized app can reach — see
        # Sources/Vendor/zstd/README.md. Delete this line and that directory
        # together if the Desktop source is ever dropped.
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Codenotch-Bridging-Header.h

  CodenotchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Codenotch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paraswtf.superpowered-codenotch.tests
        GENERATE_INFOPLIST_FILE: "YES"
        # Spelled out because the host's product name is no longer the target name.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Superpowered Codenotch.app/Contents/MacOS/Superpowered Codenotch"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Codenotch:
    build:
      targets:
        Codenotch: all
        CodenotchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CodenotchTests
