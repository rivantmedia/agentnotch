name: Fork

# Agent Notch's own checks. Upstream's workflows (ci.yml,
# package.yml, windows*.yml) only run in vinzdg/codenotch; this one runs
# everywhere else. It answers three questions:
# - do upstream's tests still pass with the fork's seams in (make test-ci, which
#   also runs Tests/ClaudeBridgeTests.swift), and do the pins still resolve;
# - do ClaudeControl's own suites pass (Swift Testing, Scripts/spm-test.sh);
# - is the fork still a fork: its edits to upstream files are exactly the
#   seams, the engine imports no SwiftUI, and no Claude usage path can read a
#   token (Scripts/check-seams.sh, Scripts/verify-token-free.sh).
# Plus the Command Line Tools build path, which is how the fork is built day
# to day (Scripts/spm-build-app.sh), and a check that such a build never reads
# an update feed. The Release workflow (release.yml) runs all of this first.
# The `rust` job checks the Windows port's fork crates on Linux, the Windows
# target included, so Windows code is linted on every push even when
# agentnotch-windows.yml's path filter skips one; it also runs the release
# workflow harness, the Windows scripts' tests and the Rust contract e2e.

on:
  push:
    branches: [main, windows-port]
  pull_request:
  workflow_dispatch:
  # The Release workflow runs these same checks before it builds anything.
  workflow_call:

permissions:
  contents: read

# A newer push cancels the older run. Named after the workflow that runs
# (github.workflow is the caller's name inside a Release run), so a release's
# checks and this workflow's own run for the same commit never cancel each
# other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.repository != 'vinzdg/codenotch'
    name: Tests and seams
    # macOS 26, as upstream's CI: an older image's Xcode cannot read the
    # project (objectVersion 77) or build the Liquid Glass APIs.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          # The seam checks diff against the merge-base with upstream.
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/vinzdg/codenotch.git
          git fetch --no-tags upstream main

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-version
          swift --version

      - name: Seams and fork boundary
        run: Scripts/check-seams.sh

      # One minimum macOS everywhere a build reads it, so the SwiftPM and the
      # Xcode builds of a commit cannot disagree about where it runs.
      - name: Deployment targets agree
        run: |
          set -euo pipefail
          # Package.swift, the package's, project.yml's deploymentTarget and
          # LSMinimumSystemVersion, and Sources/Info.plist: five values, one answer.
          values=$(
            sed -n 's/.*platforms: \[\.macOS("\([0-9.]*\)")\].*/\1/p' Package.swift Packages/ClaudeControl/Package.swift
            sed -n 's/^ *macOS: "\([0-9.]*\)".*/\1/p' project.yml
            sed -n 's/^ *LSMinimumSystemVersion: "\([0-9.]*\)".*/\1/p' project.yml
            plutil -extract LSMinimumSystemVersion raw Sources/Info.plist
          )
          echo "minimum macOS:" $values
          [[ $(wc -l <<< "$values") -eq 5 ]] || { echo "expected 5 deployment targets"; exit 1; }
          [[ $(sort -u <<< "$values" | wc -l) -eq 1 ]] || { echo "deployment targets disagree"; exit 1; }

      - name: No token paths
        run: Scripts/verify-token-free.sh

      # The package also builds alone (swift test, the snapshots tool) from its
      # own Package.resolved: its pins must be the app's (CS-14).
      - name: Package pins agree
        run: |
          python3 - <<'PY'
          import json, sys
          def pins(path):
              return {p["identity"]: p["state"].get("revision") for p in json.load(open(path))["pins"]}
          app, package = pins("Package.resolved"), pins("Packages/ClaudeControl/Package.resolved")
          drift = {k: (app.get(k), v) for k, v in package.items() if app.get(k) != v}
          if drift:
              sys.exit(f"Packages/ClaudeControl/Package.resolved disagrees with Package.resolved: {drift}")
          print("package pins agree:", sorted(package))
          PY

      - name: ClaudeControl tests (Swift Testing)
        run: Scripts/spm-test.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      # Unsigned, as upstream's CI: no identity exists on a runner.
      - name: Upstream unit tests and ClaudeBridgeTests
        run: make test-ci

      - name: Verify SwiftPM resolution
        run: make verify-deps

      - name: Command Line Tools app build
        run: Scripts/spm-build-app.sh

      # Only a release build (Scripts/release-build.sh) may read an update
      # feed: a copy built from source or a sealed one that did would replace
      # itself with the release.
      - name: Builds from source carry no update feed
        run: |
          set -euo pipefail
          Scripts/spm-build-app.sh --skip-build --bundle-id com.rivantmedia.agentnotch.sealed \
            --name "Agent Notch Sealed" --out build/sealed
          for app in "build/Agent Notch.app" "build/sealed/Agent Notch Sealed.app"; do
            plist="$app/Contents/Info.plist"
            for key in SUFeedURL SUPublicEDKey; do
              if plutil -extract "$key" raw "$plist" >/dev/null 2>&1; then
                echo "::error::$app carries $key"; exit 1
              fi
            done
            [[ "$(plutil -extract SUEnableAutomaticChecks raw "$plist")" == false ]] \
              || { echo "::error::$app checks for updates"; exit 1; }
            [[ "$(plutil -extract CFBundleVersion raw "$plist")" == "$(cat VERSION)" ]] \
              || { echo "::error::$app's CFBundleVersion is not VERSION"; exit 1; }
            echo "$app: no feed, no key, version $(cat VERSION)"
          done
          # And the release switch refuses anything but the real bundle id,
          # for that reason and not some other failure.
          status=0
          refusal="$(Scripts/spm-build-app.sh --skip-build --with-updates --bundle-id com.rivantmedia.agentnotch.dev \
            --out "$RUNNER_TEMP/refused" 2>&1)" || status=$?
          if [[ $status -ne 2 || "$refusal" != *"refusing --with-updates"* ]]; then
            echo "$refusal"
            echo "::error::--with-updates did not refuse a .dev bundle id (exit $status)"; exit 1
          fi

  rust:
    if: github.repository != 'vinzdg/codenotch'
    name: Windows fork crates (Rust)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      FORK_CRATES: -p agentnotch-proto -p agentnotch-engine -p agentnotch-win -p agentnotch-hook -p agentnotch-release
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Pinned by commit; the Windows target lets clippy type-check the
      # cfg(windows) code here. No fork crate builds C, so no Windows SDK or
      # C toolchain is needed for that.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Format
        run: |
          read -ra crates <<< "$FORK_CRATES"
          cargo fmt --check "${crates[@]}"

      - name: Clippy (Linux)
        run: |
          read -ra crates <<< "$FORK_CRATES"
          cargo clippy --locked --all-targets "${crates[@]}" -- -D warnings

      - name: Clippy (Windows target)
        run: |
          read -ra crates <<< "$FORK_CRATES"
          cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc "${crates[@]}" -- -D warnings

      - name: Tests
        run: |
          read -ra crates <<< "$FORK_CRATES"
          cargo test --locked "${crates[@]}"

      # The engine promises macOS, Linux and Windows builds with nothing but
      # Rust: a crate that compiles C would break the cross-checks above and the
      # release tool's C-free build (DESIGN-WIN §2.2).
      - name: No C dependencies
        run: |
          set -euo pipefail
          bad=0
          for crate in agentnotch-proto agentnotch-engine agentnotch-win agentnotch-hook agentnotch-release; do
            for target in x86_64-pc-windows-msvc x86_64-unknown-linux-gnu; do
              if found=$(cargo tree --locked -e normal,build -p "$crate" --target "$target" --prefix none \
                           | grep -E '^(cc|ring|openssl-sys|libsqlite3-sys|zstd-sys|bindgen) v' | sort -u); then
                echo "::error::$crate ($target) depends on: $found"
                bad=1
              fi
            done
          done
          exit "$bad"

      # Upstream's page checks and the fork's own UI tests (once they exist).
      - name: UI checks
        run: |
          set -euo pipefail
          node scripts/check-ui-scripts.mjs
          node --test test-light-surface.cjs
          node scripts/test-claude-auth-ui.cjs
          node --test scripts/test-ko-i18n.cjs
          node --test test-codex-headline.cjs
          if [[ -d agentnotch-ui-tests ]]; then node --test agentnotch-ui-tests; fi

      # release.yml can only run on main, and there it publishes, so its logic
      # is tried here: its shell steps run against a fake gh, with the release
      # tool the tests above built and the design's test seed (never a real
      # key), and the Mac release steps are compared with the ones 1.0.1
      # shipped with (DESIGN-WIN R9).
      - name: Release workflow harness
        working-directory: .
        run: |
          set -euo pipefail
          python3 windows/tools/release-harness/run.py
          python3 windows/tools/release-harness/identical.py

      # The Windows build, smoke and facts scripts' own tests (their pure parts
      # run anywhere; PowerShell 7 is on Ubuntu runners), and bump-version.sh's
      # and verify-token-free.sh's Windows rules', each in a temporary copy. Globs, quoted: Node takes them as test file
      # patterns, not folders.
      - name: Tool tests
        working-directory: .
        run: |
          set -euo pipefail
          node --test "windows/tools/tests/*.test.mjs" "windows/scripts/smoke/*.test.mjs" "windows/scripts/smoke/real-claude/*.test.mjs"
          pwsh -NoProfile -File windows/tools/tests/check-powershell.ps1
          pwsh -NoProfile -File windows/tools/tests/run.ps1
          bash windows/tools/tests/bump-version.test.sh
          bash windows/tools/tests/verify-token-free.test.sh

      # The Rust app's sync request through the website's real route into
      # Postgres, and the answer back (Docker). Gated until the Rust side of
      # the contract exists (windows/scripts/smoke/gates.json, rustContract).
      - name: Rust contract e2e
        working-directory: .
        run: |
          set -euo pipefail
          gates=windows/scripts/smoke/gates.json
          if [[ "$(jq -r .rustContract "$gates")" != true ]]; then
            echo "::notice::Rust contract e2e not run: waiting for $(jq -r '._why.rustContract' "$gates")."
            exit 0
          fi
          # The script runs the website's real route, so it needs web/'s packages.
          (cd web && npm ci --no-audit --no-fund)
          AGENTNOTCH_CONTRACT_APP=rust Scripts/cloud-contract-e2e.sh
