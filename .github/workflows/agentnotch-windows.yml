name: Windows

# Agent Notch for Windows (DESIGN-WIN §6.1): the fork crates' checks and tests
# on a real Windows runner, upstream's app crate with the fork's seams in, the
# NSIS installer, and a smoke test of what a user would run. Upstream's
# windows.yml and windows-package.yml stay upstream's (they only run in
# vinzdg/codenotch, and windows-package builds upstream's token-reading app:
# never run it here).
#
# The Release workflow calls this with `release: true` and the updater's public
# key; every other build carries no key and no feed, so a copy built from
# source never updates itself. The update seed never comes near this workflow.
#
# Code signing (Authenticode, Maintainer decision Q4) is the only secret here,
# and only in a release build: the WINDOWS_SIGN_* values (a .pfx pair, or the
# six Azure Artifact Signing values; agentnotch-build.ps1 lists them). They
# live in the `windows-signing` environment (deployment branches: main only),
# which the build job selects only when `release` is true: a job that calls a
# reusable workflow can't name an environment, but the called job can, and its
# environment's secrets win over any the caller passes (GitHub's rule). The
# workflow_call secrets below are declared so a caller may pass them too;
# release.yml passes none, never `secrets: inherit`. Only the "Build the
# installer" step sees them, and the build script takes them out of its
# environment before anything compiles. Without them the installer is
# unsigned and windows-release-info.env says AUTHENTICODE=unsigned.
#
# Every branch whose push touches the port runs it: a work package is proven on
# Windows by this workflow going green on its own branch (DESIGN-WIN §8). `**`
# rather than no branch filter, so a tag push (path filters don't apply to
# tags) never starts it.
on:
  push:
    branches: ['**']
    paths:
      - 'windows/**'
      - 'VERSION'
      - 'app-config.json'
      - 'web/contract/**'
      - 'Scripts/check-seams.sh'
      - 'Scripts/fork-seams.txt'
      - 'Scripts/verify-token-free.sh'
      - '.github/workflows/agentnotch-windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'VERSION'
      - 'app-config.json'
      - 'web/contract/**'
      - 'Scripts/check-seams.sh'
      - 'Scripts/fork-seams.txt'
      - 'Scripts/verify-token-free.sh'
      - '.github/workflows/agentnotch-windows.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      updater_pubkey:
        description: The Tauri updater public key (release builds only)
        type: string
        default: ''
      expected_key_id:
        description: The key id the doctor must show (release builds only)
        type: string
        default: ''
      release:
        description: A release build (no cache, the installer as the only artifact)
        type: boolean
        default: false
    secrets:
      WINDOWS_SIGN_PFX_BASE64: { required: false }
      WINDOWS_SIGN_PFX_PASSWORD: { required: false }
      WINDOWS_SIGN_TIMESTAMP_URL: { required: false }
      WINDOWS_SIGN_AZURE_ENDPOINT: { required: false }
      WINDOWS_SIGN_AZURE_ACCOUNT: { required: false }
      WINDOWS_SIGN_AZURE_PROFILE: { required: false }
      WINDOWS_SIGN_AZURE_TENANT_ID: { required: false }
      WINDOWS_SIGN_AZURE_CLIENT_ID: { required: false }
      WINDOWS_SIGN_AZURE_CLIENT_SECRET: { required: false }

permissions:
  contents: read

# Never fork.yml's group: both run inside a Release. A release build is never
# cancelled by a newer push.
concurrency:
  group: ${{ github.workflow }}-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow != 'Release' }}

env:
  CARGO_TERM_COLOR: always
  FORK_CRATES: -p agentnotch-proto -p agentnotch-engine -p agentnotch-win -p agentnotch-hook -p agentnotch-release

jobs:
  build:
    if: github.repository != 'vinzdg/codenotch'
    name: Build, test and smoke-test
    # Pinned, like Xcode 26.6 for the Mac: an image roll-over must not change a
    # release build.
    runs-on: windows-2025
    # The code signing secrets' home, in a release build only (an empty name is
    # no environment).
    environment: ${{ inputs.release && 'windows-signing' || '' }}
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Fails the job, never skips a test: the UI tests need a desktop, the
      # hook-command tests need Git Bash, and no test may ever reach a real
      # Claude Code or a running copy of either app.
      - name: Preflight
        run: |
          $problems = @()
          Add-Type -Namespace AgentNotch -Name Desktop -MemberDefinition @'
          [DllImport("user32.dll", SetLastError = true)] public static extern System.IntPtr OpenInputDesktop(uint flags, bool inherit, uint access);
          [DllImport("user32.dll")] public static extern bool CloseDesktop(System.IntPtr desktop);
          '@
          if (-not [Environment]::UserInteractive) { $problems += 'the session is not interactive' }
          $desktop = [AgentNotch.Desktop]::OpenInputDesktop(0, $false, 0x0001)
          if ($desktop -eq [IntPtr]::Zero) { $problems += 'there is no input desktop' } else { [void][AgentNotch.Desktop]::CloseDesktop($desktop) }
          if (-not (Test-Path "$env:ProgramFiles\Git\bin\bash.exe")) { $problems += 'Git Bash is missing' }
          foreach ($name in 'claude', 'claude.exe', 'claude.cmd') {
            $found = Get-Command $name -ErrorAction SilentlyContinue
            if ($found) { $problems += "a real Claude Code is reachable: $($found.Source)" }
          }
          foreach ($path in "$env:APPDATA\npm\claude.cmd", "$env:USERPROFILE\.local\bin\claude.exe") {
            if (Test-Path $path) { $problems += "a real Claude Code is installed: $path" }
          }
          if (Get-Process -Name agentnotch, codenotch -ErrorAction SilentlyContinue) {
            $problems += 'agentnotch.exe or codenotch.exe is already running'
          }
          $identity = [Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()
          $elevated = $identity.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $uac = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System').EnableLUA
          "Runner: elevated=$elevated, UAC EnableLUA=$uac" >> $env:GITHUB_STEP_SUMMARY
          if ($problems) {
            foreach ($p in $problems) { Write-Host "::error::$p" }
            exit 1
          }

      # Pinned by commit (a moving branch could change under a release build).
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt

      # Not in a release build: it must come from a clean, uncached tree.
      - uses: Swatinem/rust-cache@v2
        if: ${{ !inputs.release }}
        with:
          workspaces: windows

      # Node 22: built-in WebSocket for the smoke test's CDP driver, no npm deps.
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Upstream's five page checks, then the fork's own (once they exist).
      - name: UI checks
        run: |
          node scripts/check-ui-scripts.mjs
          if ($LASTEXITCODE) { exit 1 }
          node --test test-light-surface.cjs
          if ($LASTEXITCODE) { exit 1 }
          node scripts/test-claude-auth-ui.cjs
          if ($LASTEXITCODE) { exit 1 }
          node --test scripts/test-ko-i18n.cjs
          if ($LASTEXITCODE) { exit 1 }
          node --test test-codex-headline.cjs
          if ($LASTEXITCODE) { exit 1 }
          if (Test-Path agentnotch-ui-tests) {
            node --test agentnotch-ui-tests
            if ($LASTEXITCODE) { exit 1 }
          }

      - name: Format (fork crates)
        run: cargo fmt --check $env:FORK_CRATES.Split(' ')

      - name: Clippy (fork crates)
        run: cargo clippy --locked --all-targets $env:FORK_CRATES.Split(' ') -- -D warnings

      # Every member against the committed lock, upstream's app and hook crates
      # included: the one place the glue meets the engine's real API on Windows.
      - name: Check the workspace
        run: cargo check --locked --workspace --all-targets

      # AGENTNOTCH_CI_ADMIN lets win_admin.rs create a local user and spawn
      # medium-integrity processes: allowed on this throwaway runner only.
      - name: Tests (fork crates)
        env:
          AGENTNOTCH_CI_ADMIN: '1'
        run: cargo test --locked $env:FORK_CRATES.Split(' ')

      # Upstream's suite with the seams in, and the glue's own unit tests. Never
      # --ignored: one of upstream's ignored tests runs the installed claude.
      - name: Tests (upstream's app crate)
        run: cargo test --locked -p codenotch

      # Upstream's own warnings are only reported; one in the fork's code fails.
      - name: Build the app crate (no warnings in fork code)
        shell: bash
        run: |
          set -o pipefail
          cargo build --locked -p codenotch --message-format short 2>&1 | tee "$RUNNER_TEMP/app-build.log"
          if grep -E '^(codenotch[\\/]src[\\/]agentnotch|agentnotch-[a-z]+)[\\/][^:]*:[0-9]+:[0-9]+: warning' "$RUNNER_TEMP/app-build.log"; then
            echo "::error::warnings in the fork's code (above)"
            exit 1
          fi

      # agentnotch-build.ps1 (DESIGN-WIN §6.1 step 12): VERSION == tauri.conf.json,
      # the hook with its C runtime in its own target dir, the overlay (the
      # version; in a release build the update key and feed), the pinned Tauri
      # CLI (npm ci in windows/tools), compile, then bundle. The signing values
      # reach only this step, only in a release build, and the script hands them
      # to the bundling alone. Writes out\windows-release-info.env and the
      # outputs version, name and authenticode.
      - name: Build the installer
        id: installer
        env:
          UPDATER_PUBKEY: ${{ inputs.updater_pubkey }}
          WINDOWS_SIGN_PFX_BASE64: ${{ inputs.release && secrets.WINDOWS_SIGN_PFX_BASE64 || '' }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ inputs.release && secrets.WINDOWS_SIGN_PFX_PASSWORD || '' }}
          WINDOWS_SIGN_TIMESTAMP_URL: ${{ inputs.release && secrets.WINDOWS_SIGN_TIMESTAMP_URL || '' }}
          WINDOWS_SIGN_AZURE_ENDPOINT: ${{ inputs.release && secrets.WINDOWS_SIGN_AZURE_ENDPOINT || '' }}
          WINDOWS_SIGN_AZURE_ACCOUNT: ${{ inputs.release && secrets.WINDOWS_SIGN_AZURE_ACCOUNT || '' }}
          WINDOWS_SIGN_AZURE_PROFILE: ${{ inputs.release && secrets.WINDOWS_SIGN_AZURE_PROFILE || '' }}
          WINDOWS_SIGN_AZURE_TENANT_ID: ${{ inputs.release && secrets.WINDOWS_SIGN_AZURE_TENANT_ID || '' }}
          WINDOWS_SIGN_AZURE_CLIENT_ID: ${{ inputs.release && secrets.WINDOWS_SIGN_AZURE_CLIENT_ID || '' }}
          WINDOWS_SIGN_AZURE_CLIENT_SECRET: ${{ inputs.release && secrets.WINDOWS_SIGN_AZURE_CLIENT_SECRET || '' }}
        run: |
          $build = @{ Out = 'out' }
          if ($env:UPDATER_PUBKEY) { $build.UpdaterPubkey = $env:UPDATER_PUBKEY }
          ./scripts/agentnotch-build.ps1 @build
          Get-Content out\windows-release-info.env

      # What a user gets, on a runner that has never seen Agent Notch (DESIGN-WIN
      # §7.5): the install, a temporary Claude setup the app is pointed at, the
      # doctor, a sealed launch, a hook that fails open with no app, autostart and
      # the uninstall. Phases that wait for a package are gated in
      # scripts/smoke/gates.json: reported here, never silently skipped, and a
      # release run refuses a closed gate. Never runs claude (only the fake the
      # fork's test build made, in target\debug) and stops only its own processes,
      # by handle.
      - name: Smoke test
        env:
          V: ${{ steps.installer.outputs.version }}
          INSTALLER: out\${{ steps.installer.outputs.name }}
          UPDATER_PUBKEY: ${{ inputs.updater_pubkey }}
          EXPECTED_KEY_ID: ${{ inputs.expected_key_id }}
          RELEASE: ${{ inputs.release }}
        run: |
          $smoke = @{
            Installer = $env:INSTALLER
            Version   = $env:V
            Updates   = $(if ($env:UPDATER_PUBKEY) { 'on' } else { 'off' })
            Artifacts = 'out\smoke'
            Bins      = 'target\debug'
          }
          if ($env:EXPECTED_KEY_ID) { $smoke.KeyId = $env:EXPECTED_KEY_ID }
          if ($env:RELEASE -eq 'true') { $smoke.Release = $true }
          ./scripts/agentnotch-smoke.ps1 @smoke
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # The signing path a release takes once WINDOWS_SIGN_* exist, proven on
      # every branch with a throwaway self-signed certificate: the same bundling
      # step and signCommand, then every signature checked. The installer above
      # stays unsigned; the app and hook bytes are put back afterwards.
      - name: Code signing path (throwaway certificate)
        if: ${{ !inputs.release }}
        run: ./scripts/agentnotch-build.ps1 -CheckSigning

      - name: Upload the installer and the smoke test's files
        if: ${{ !inputs.release && always() && steps.installer.outputs.name != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: AgentNotch-Setup-${{ steps.installer.outputs.version }}-${{ github.sha }}
          path: |
            windows/out/${{ steps.installer.outputs.name }}
            windows/out/smoke/**
          retention-days: 14
          if-no-files-found: error

      # The update signature and the publishing are release.yml's own jobs, never
      # here; the release info says whether the installer is code-signed.
      - name: Hand the installer to the release
        if: ${{ inputs.release }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned
          path: |
            windows/out/${{ steps.installer.outputs.name }}
            windows/out/windows-release-info.env
          retention-days: 3
          if-no-files-found: error

      - name: Summary
        if: ${{ !inputs.release }}
        run: |
          "Unsigned, no update feed (built from source). SmartScreen: More info, then Run anyway. Never attach it to a release." >> $env:GITHUB_STEP_SUMMARY
