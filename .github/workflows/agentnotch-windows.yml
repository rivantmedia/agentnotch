name: Windows

# Agent Notch for Windows (DESIGN-WIN §6.1): the fork crates' checks and tests
# on a real Windows runner, upstream's app crate with the fork's seams in, the
# NSIS installer, and a smoke test of what a user would run. Upstream's
# windows.yml and windows-package.yml stay upstream's (they only run in
# vinzdg/codenotch, and windows-package builds upstream's token-reading app:
# never run it here).
#
# The Release workflow calls this with `release: true` and the updater's public
# key; every other build carries no key and no feed, so a copy built from
# source never updates itself. No secret is ever read here.
on:
  push:
    branches: [windows-port]
    paths:
      - 'windows/**'
      - 'VERSION'
      - 'app-config.json'
      - 'web/contract/**'
      - 'Scripts/check-seams.sh'
      - 'Scripts/fork-seams.txt'
      - 'Scripts/verify-token-free.sh'
      - '.github/workflows/agentnotch-windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'VERSION'
      - 'app-config.json'
      - 'web/contract/**'
      - 'Scripts/check-seams.sh'
      - 'Scripts/fork-seams.txt'
      - 'Scripts/verify-token-free.sh'
      - '.github/workflows/agentnotch-windows.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      updater_pubkey:
        description: The Tauri updater public key (release builds only)
        type: string
        default: ''
      expected_key_id:
        description: The key id the doctor must show (release builds only)
        type: string
        default: ''
      release:
        description: A release build (no cache, the installer as the only artifact)
        type: boolean
        default: false

permissions:
  contents: read

# Never fork.yml's group: both run inside a Release. A release build is never
# cancelled by a newer push.
concurrency:
  group: ${{ github.workflow }}-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow != 'Release' }}

env:
  CARGO_TERM_COLOR: always
  FORK_CRATES: -p agentnotch-proto -p agentnotch-engine -p agentnotch-win -p agentnotch-hook -p agentnotch-release

jobs:
  build:
    if: github.repository != 'vinzdg/codenotch'
    name: Build, test and smoke-test
    # Pinned, like Xcode 26.6 for the Mac: an image roll-over must not change a
    # release build.
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Fails the job, never skips a test: the UI tests need a desktop, the
      # hook-command tests need Git Bash, and no test may ever reach a real
      # Claude Code or a running copy of either app.
      - name: Preflight
        run: |
          $problems = @()
          Add-Type -Namespace AgentNotch -Name Desktop -MemberDefinition @'
          [DllImport("user32.dll", SetLastError = true)] public static extern System.IntPtr OpenInputDesktop(uint flags, bool inherit, uint access);
          [DllImport("user32.dll")] public static extern bool CloseDesktop(System.IntPtr desktop);
          '@
          if (-not [Environment]::UserInteractive) { $problems += 'the session is not interactive' }
          $desktop = [AgentNotch.Desktop]::OpenInputDesktop(0, $false, 0x0001)
          if ($desktop -eq [IntPtr]::Zero) { $problems += 'there is no input desktop' } else { [void][AgentNotch.Desktop]::CloseDesktop($desktop) }
          if (-not (Test-Path "$env:ProgramFiles\Git\bin\bash.exe")) { $problems += 'Git Bash is missing' }
          foreach ($name in 'claude', 'claude.exe', 'claude.cmd') {
            $found = Get-Command $name -ErrorAction SilentlyContinue
            if ($found) { $problems += "a real Claude Code is reachable: $($found.Source)" }
          }
          foreach ($path in "$env:APPDATA\npm\claude.cmd", "$env:USERPROFILE\.local\bin\claude.exe") {
            if (Test-Path $path) { $problems += "a real Claude Code is installed: $path" }
          }
          if (Get-Process -Name agentnotch, codenotch -ErrorAction SilentlyContinue) {
            $problems += 'agentnotch.exe or codenotch.exe is already running'
          }
          $identity = [Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()
          $elevated = $identity.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $uac = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System').EnableLUA
          "Runner: elevated=$elevated, UAC EnableLUA=$uac" >> $env:GITHUB_STEP_SUMMARY
          if ($problems) {
            foreach ($p in $problems) { Write-Host "::error::$p" }
            exit 1
          }

      # Pinned by commit (a moving branch could change under a release build).
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt

      # Not in a release build: it must come from a clean, uncached tree.
      - uses: Swatinem/rust-cache@v2
        if: ${{ !inputs.release }}
        with:
          workspaces: windows

      # Node 22: built-in WebSocket for the smoke test's CDP driver, no npm deps.
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Upstream's five page checks, then the fork's own (once they exist).
      - name: UI checks
        run: |
          node scripts/check-ui-scripts.mjs
          if ($LASTEXITCODE) { exit 1 }
          node --test test-light-surface.cjs
          if ($LASTEXITCODE) { exit 1 }
          node scripts/test-claude-auth-ui.cjs
          if ($LASTEXITCODE) { exit 1 }
          node --test scripts/test-ko-i18n.cjs
          if ($LASTEXITCODE) { exit 1 }
          node --test test-codex-headline.cjs
          if ($LASTEXITCODE) { exit 1 }
          if (Test-Path agentnotch-ui-tests) {
            node --test agentnotch-ui-tests
            if ($LASTEXITCODE) { exit 1 }
          }

      - name: Format (fork crates)
        run: cargo fmt --check $env:FORK_CRATES.Split(' ')

      - name: Clippy (fork crates)
        run: cargo clippy --locked --all-targets $env:FORK_CRATES.Split(' ') -- -D warnings

      # Every member against the committed lock, upstream's app and hook crates
      # included: the one place the glue meets the engine's real API on Windows.
      - name: Check the workspace
        run: cargo check --locked --workspace --all-targets

      # AGENTNOTCH_CI_ADMIN lets win_admin.rs create a local user and spawn
      # medium-integrity processes: allowed on this throwaway runner only.
      - name: Tests (fork crates)
        env:
          AGENTNOTCH_CI_ADMIN: '1'
        run: cargo test --locked $env:FORK_CRATES.Split(' ')

      # Upstream's suite with the seams in, and the glue's own unit tests. Never
      # --ignored: one of upstream's ignored tests runs the installed claude.
      - name: Tests (upstream's app crate)
        run: cargo test --locked -p codenotch

      # Upstream's own warnings are only reported; one in the fork's code fails.
      - name: Build the app crate (no warnings in fork code)
        shell: bash
        run: |
          set -o pipefail
          cargo build --locked -p codenotch --message-format short 2>&1 | tee "$RUNNER_TEMP/app-build.log"
          if grep -E '^(codenotch[\\/]src[\\/]agentnotch|agentnotch-[a-z]+)[\\/][^:]*:[0-9]+:[0-9]+: warning' "$RUNNER_TEMP/app-build.log"; then
            echo "::error::warnings in the fork's code (above)"
            exit 1
          fi

      # The hook carries its C runtime (Claude Code may run it where
      # vcruntime140.dll is missing) and has its own target dir (the bundler
      # copies resources beside the app in target\release). The overlay pins the
      # version (VERSION), and in a release build adds the update key and feed.
      - name: Build the installer
        id: installer
        env:
          UPDATER_PUBKEY: ${{ inputs.updater_pubkey }}
        run: |
          $V = (Get-Content ..\VERSION -Raw).Trim()
          $conf = Get-Content codenotch\tauri.conf.json -Raw | ConvertFrom-Json
          if ($conf.version -ne $V) { throw "tauri.conf.json says $($conf.version), VERSION says $V" }
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          cargo build --release --locked -p agentnotch-hook --bin agentnotch-hook --target-dir target/hook
          if ($LASTEXITCODE) { exit 1 }
          Remove-Item Env:RUSTFLAGS
          $overlay = [ordered]@{ version = $V }
          if ($env:UPDATER_PUBKEY) {
            $overlay.plugins = @{ updater = [ordered]@{
              pubkey = $env:UPDATER_PUBKEY
              endpoints = @('https://github.com/rivantmedia/agentnotch/releases/latest/download/latest.json')
              requireSignedVersion = $true
              windows = @{ installMode = 'passive' } } }
          }
          $overlayPath = Join-Path $env:RUNNER_TEMP 'agentnotch.build.json'
          $overlay | ConvertTo-Json -Depth 6 | Set-Content -Path $overlayPath -Encoding utf8NoBOM
          Push-Location codenotch
          npx --yes @tauri-apps/cli@2.11.4 build --config tauri.bundle.conf.json --config $overlayPath -- --locked
          $built = $LASTEXITCODE
          Pop-Location
          if ($built) { exit 1 }
          $setup = @(Get-ChildItem target\release\bundle\nsis\*-setup.exe)
          if ($setup.Count -ne 1) { throw "expected one installer, found $($setup.Count)" }
          New-Item -ItemType Directory -Force out | Out-Null
          $name = "AgentNotch-$V-Setup.exe"
          Copy-Item $setup[0].FullName "out\$name"
          $product = (Get-Item "out\$name").VersionInfo.ProductVersion
          if (-not $product.StartsWith($V)) { throw "the installer's ProductVersion is $product, not $V" }
          "version=$V" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT

      # What a user gets, on a runner that has never seen Agent Notch: the
      # install, a sealed launch (fixture data only: no Claude folder, no
      # network, no child process) that stays up and shows its notch, the
      # doctor, a hook that fails open with no app, and the uninstall. Stops
      # only its own processes, by id.
      - name: Smoke test
        env:
          V: ${{ steps.installer.outputs.version }}
          INSTALLER: out\${{ steps.installer.outputs.name }}
        run: |
          $smoke = New-Item -ItemType Directory -Force out\smoke
          $dir = Join-Path $env:LOCALAPPDATA 'Agent Notch'
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Agent Notch'
          $data = Join-Path $env:APPDATA 'Agent Notch'
          $sealedData = Join-Path $env:APPDATA 'Agent Notch Sealed'
          function Wait-Until([scriptblock]$ready, [int]$seconds, [string]$what) {
            $deadline = (Get-Date).AddSeconds($seconds)
            while (-not (& $ready)) {
              if ((Get-Date) -gt $deadline) { throw "timed out: $what" }
              Start-Sleep -Milliseconds 500
            }
          }

          # 1. Install, per user, silently.
          Start-Process -FilePath $env:INSTALLER -ArgumentList '/S' -Wait
          Wait-Until { (Test-Path "$dir\agentnotch.exe") -and (Test-Path "$dir\agentnotch-hook.exe") -and (Test-Path "$dir\uninstall.exe") } 60 'the installed files'
          $key = Get-ItemProperty $uninstallKey
          if ($key.DisplayName -ne 'Agent Notch') { throw "uninstall key DisplayName is '$($key.DisplayName)'" }
          if ($key.DisplayVersion -ne $env:V) { throw "uninstall key DisplayVersion is '$($key.DisplayVersion)'" }
          if ($key.Publisher -ne 'Rivant Media') { throw "uninstall key Publisher is '$($key.Publisher)'" }
          $open = (Get-ItemProperty 'HKCU:\Software\Classes\agentnotch\shell\open\command').'(default)'
          if ($open -ne "`"$dir\agentnotch.exe`" `"%1`"") { throw "agentnotch: is registered as '$open'" }

          # 2. A sealed launch stays up for 20 s and shows a window.
          Remove-Item -Recurse -Force $sealedData -ErrorAction SilentlyContinue
          $env:AGENTNOTCH_SAFE_MODE = '1'
          $app = Start-Process -FilePath "$dir\agentnotch.exe" -PassThru
          Remove-Item Env:AGENTNOTCH_SAFE_MODE
          Start-Sleep -Seconds 20
          if ($app.HasExited) { throw "the sealed app exited with $($app.ExitCode)" }
          Add-Type -Namespace AgentNotch -Name Windows -MemberDefinition @'
          delegate bool EnumProc(System.IntPtr hwnd, System.IntPtr param);
          [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc proc, System.IntPtr param);
          [DllImport("user32.dll")] static extern bool IsWindowVisible(System.IntPtr hwnd);
          [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(System.IntPtr hwnd, out uint pid);
          public static int Visible(uint pid) {
            int count = 0;
            EnumWindows((h, p) => { uint owner; GetWindowThreadProcessId(h, out owner); if (owner == pid && IsWindowVisible(h)) count++; return true; }, System.IntPtr.Zero);
            return count;
          }
          '@
          $visible = [AgentNotch.Windows]::Visible([uint32]$app.Id)
          Stop-Process -Id $app.Id -Force
          $app.WaitForExit(10000) | Out-Null
          if ($visible -lt 1) { throw 'the sealed app shows no window' }
          Copy-Item "$sealedData\run.log" "$smoke\sealed-run.log" -ErrorAction SilentlyContinue
          $runLog = Get-Content "$sealedData\run.log" -Raw -ErrorAction SilentlyContinue
          if ($runLog -notmatch 'an: hub started \(sealed\)') { throw "the sealed hub did not start: $runLog" }
          if (Test-Path $data) { throw "a sealed run wrote to $data" }
          Remove-Item -Recurse -Force $sealedData -ErrorAction SilentlyContinue

          # 3. The doctor: exit 0, and never a credential or a token in its text.
          $doctor = Start-Process -FilePath "$dir\agentnotch.exe" -ArgumentList 'doctor' -Wait -PassThru
          $report = Get-Content "$data\doctor.log" -Raw -ErrorAction SilentlyContinue
          Set-Content "$smoke\doctor.log" $report
          $report
          if ($doctor.ExitCode -ne 0) { throw "doctor exited with $($doctor.ExitCode)" }
          if (-not $report) { throw 'the doctor wrote no doctor.log' }
          foreach ($secret in '.credentials.json', 'claudeAiOauth', 'accessToken') {
            if ($report.Contains($secret)) { throw "the doctor's report names $secret" }
          }

          # 4. The hook fails open with no app beside it: exit 0, nothing printed.
          $hook = Join-Path $env:RUNNER_TEMP 'agentnotch-hook.exe'
          Copy-Item "$dir\agentnotch-hook.exe" $hook
          foreach ($argv in @('hook', 'hook --exec', 'statusline', 'bogus', '')) {
            $psi = [Diagnostics.ProcessStartInfo]::new($hook, $argv)
            $psi.UseShellExecute = $false
            $psi.RedirectStandardInput = $true
            $psi.RedirectStandardOutput = $true
            $run = [Diagnostics.Process]::Start($psi)
            $run.StandardInput.Write('{ not json')
            $run.StandardInput.Close()
            if (-not $run.WaitForExit(3000)) { $run.Kill(); throw "the hook hung ($argv)" }
            $printed = $run.StandardOutput.ReadToEnd()
            if ($run.ExitCode -ne 0) { throw "the hook exited with $($run.ExitCode) ($argv)" }
            if ($printed) { throw "the hook printed '$printed' ($argv)" }
          }

          # 5. Uninstall; the NSIS uninstaller re-launches itself, so -Wait returns early.
          Start-Process -FilePath "$dir\uninstall.exe" -ArgumentList '/S' -Wait
          Wait-Until { -not (Test-Path "$dir\agentnotch.exe") -and -not (Test-Path $uninstallKey) } 60 'the uninstall'
          if (Test-Path 'HKCU:\Software\Classes\agentnotch') { throw 'the agentnotch: scheme is still registered' }

      - name: Upload the installer and the smoke test's files
        if: ${{ !inputs.release && always() && steps.installer.outputs.name != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: AgentNotch-Setup-${{ steps.installer.outputs.version }}-${{ github.sha }}
          path: |
            windows/out/${{ steps.installer.outputs.name }}
            windows/out/smoke/**
          retention-days: 14
          if-no-files-found: error

      # Signed and published by release.yml's own jobs, never here.
      - name: Hand the installer to the release
        if: ${{ inputs.release }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned
          path: windows/out/${{ steps.installer.outputs.name }}
          retention-days: 3
          if-no-files-found: error

      - name: Summary
        if: ${{ !inputs.release }}
        run: |
          "Unsigned, no update feed (built from source). SmartScreen: More info, then Run anyway. Never attach it to a release." >> $env:GITHUB_STEP_SUMMARY
